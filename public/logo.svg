<svg
  width="420"
  height="105"
  viewBox="0 0 420 105"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Clavisimo Logo"
>
  <defs>
    <linearGradient id="headerCircleGradient" x1="6" y1="10" x2="78" y2="88">
      <stop stop-color="#ffb45f" />
      <stop offset="0.5" stop-color="#fb923c" />
      <stop offset="1" stop-color="#f97316" />
    </linearGradient>
    <filter id="headerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#f97316" flood-opacity="0.28" />
    </filter>
    <filter id="headerShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#020617" flood-opacity="0.42" />
    </filter>
  </defs>

  <circle cx="48" cy="56" r="35" fill="url(#headerCircleGradient)" filter="url(#headerGlow)" />
  <circle cx="48" cy="56" r="41" stroke="rgba(249,115,22,0.30)" stroke-width="6" />
  <circle cx="48" cy="56" r="29" stroke="rgba(15,23,42,0.46)" stroke-width="2" />

  <text
    x="48"
    y="75"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="bold"
    font-size="55"
    fill="#111827"
  >C</text>

  <g
    stroke="#f8fafc"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#headerShadow)"
  >
    <circle cx="103" cy="24" r="12" fill="none" />
    <line x1="115" y1="24" x2="344" y2="24" />
    <path d="M344 24 L344 36 L356 36 L356 46 L370 46" />
  </g>

  <text
    x="86"
    y="75"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="bold"
    font-size="54"
    filter="url(#headerShadow)"
